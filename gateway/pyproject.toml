[project]
name = "search-gateway"
version = "0.1.0"
description = "Authenticated, cached search API gateway in front of a private SearXNG instance"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.121.2",
    "uvicorn[standard]==0.41.0",
    "httpx[http2]==0.28.1",
    "pydantic==2.12.4",
    "pydantic-settings==2.13.1",
    "asyncpg==0.30.0",
    "redis==7.1.0",
    "typer==0.26.8",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "respx==0.22.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
